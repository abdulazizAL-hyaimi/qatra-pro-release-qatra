name: Qatra ERP - Apply Unified Shell

on:
  push:
    branches:
      - feature/qatra-unified-erp-20260726
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qatra-unified-shell-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/qatra-unified-erp-20260726
          fetch-depth: 0
      - name: Apply unified ERP source migration
        run: |
          python3 build-tools/apply-unified-erp-shell.py
          python3 build-tools/stabilize-unified-erp-source.py
          python3 build-tools/apply-erp-usability-phase.py
          python3 build-tools/apply-water-printing-reports.py
          python3 build-tools/harden-erp-document-service.py
          python3 build-tools/harden-water-document-templates.py
      - name: Validate generated source
        run: |
          set -euo pipefail
          git diff --check
          node build-tools/test-unified-erp-source.js
          node build-tools/test-erp-usability-source.js
          node build-tools/test-water-operations-source.js
          node build-tools/test-water-corrections-source.js
          node build-tools/test-erp-recovery-trial-source.js
          node build-tools/test-erp-device-sync-source.js
          node build-tools/test-erp-device-receipts-source.js
          node build-tools/test-erp-procurement-inventory-source.js
          node build-tools/test-erp-advanced-procurement-inventory-source.js
          node build-tools/test-erp-compensation-source.js
          node build-tools/test-erp-android-services-source.js
          node build-tools/test-erp-assets-workforce-maintenance-source.js
          node build-tools/test-water-printing-reports-source.js
      - name: Commit generated Android integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Unified shell already applied and stable"
            exit 0
          fi
          git config user.name "qatra-pro-build-bot"
          git config user.email "qatra-pro-build-bot@users.noreply.github.com"
          git add app/src/main/java/com/qatra/pro/MainActivity.java \
                  app/src/main/java/com/qatra/pro/QatraDatabase.java \
                  app/src/main/java/com/qatra/pro/QatraCrypto.java \
                  app/src/main/java/com/qatra/pro/QatraNamespacePolicy.java \
                  app/src/main/java/com/qatra/pro/QatraUnifiedUserStore.java \
                  app/src/main/java/com/qatra/pro/UnifiedMainActivity.java \
                  app/src/main/java/com/qatra/pro/QatraWebHost.java \
                  app/src/main/java/com/qatra/pro/QatraFileRouter.java \
                  app/src/main/java/com/qatra/pro/QatraErpDocumentService.java \
                  app/src/main/assets/qatra/assets/erp.js \
                  app/src/main/assets/qatra/assets/erp_water_documents.js \
                  app/src/main/assets/qatra/assets/erp_water_reports.js \
                  app/src/main/assets/qatra/assets/erp_water_corrections.js \
                  app/src/main/assets/qatra/assets/erp_safety_center.js \
                  app/src/main/assets/qatra/assets/erp_sync_center.js \
                  app/src/main/assets/qatra/erp.html \
                  app/src/main/assets/qatra/sw.js
          git commit -m "تثبيت التعافي والمزامنة المحكومة في Qatra ERP"
          git pull --rebase origin feature/qatra-unified-erp-20260726
          git push origin HEAD:feature/qatra-unified-erp-20260726

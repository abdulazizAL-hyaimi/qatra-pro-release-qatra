<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>قطرة برو | الصندوق</title>
  <meta name="theme-color" content="#102A43">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/cashier.css">
  <link rel="stylesheet" href="assets/design-v25.css">
  <link rel="stylesheet" href="assets/qatra-brand.css">
  <link rel="stylesheet" href="assets/ux-v26.css">
</head>
<body class="cashier-app-body role-cashier">
  <header class="app-header qatra-brand-header no-print">
    <div class="qatra-brand-lockup">
      <img class="qatra-project-mark" src="assets/qatra-pro-mark.svg" alt="Qatra Pro">
      <div class="qatra-brand-copy"><b>QATRA <span>PRO</span></b><small>نظام إدارة خدمات المياه</small><em>الصندوق</em></div>
    </div>
    <div class="header-actions">
      <button class="header-action qatra-header-action" onclick="Cashier.openDriveSync()">المزامنة</button>
      <button class="header-action qatra-header-action" onclick="Cashier.openSettings()">الإعدادات</button>
    </div>
  </header>
  <nav class="tabs no-print compact-tabs cashier-nav" aria-label="التنقل">
    <button data-tab="home" class="active"><span>⌂</span>الرئيسية</button>
    <button data-tab="transactions"><span>⇄</span>الحركات</button>
    <button data-tab="direct"><span>＋</span>تحصيل مباشر</button>
    <button data-tab="sync"><span>↥</span>التسليم</button>
    <button data-tab="more"><span>⠿</span>المزيد</button>
  </nav>
  <main id="cashierRoot">
    <section id="home" class="cashier-tab active"></section>
    <section id="transactions" class="cashier-tab"></section>
    <section id="direct" class="cashier-tab"></section>
    <section id="sync" class="cashier-tab"></section>
    <section id="more" class="cashier-tab">
      <div class="card qatra-more-card"><h2>المزيد</h2><div class="menu-grid qatra-more-grid">
        <button onclick="QatraSecurity.openLicense()"><span>🔑</span><b>المعلومات والتواصل والترخيص</b></button>
        <button onclick="QatraSecurity.open()"><span>🛡️</span><b>الأمان والدخول</b></button>
        <button onclick="Cashier.openDriveSync()"><span>☁️</span><b>مركز المزامنة</b></button>
        <button onclick="QatraDriveBackup.open()"><span>🔄</span><b>نسخ Google Drive</b></button>
        <button onclick="Cashier.openSettings()"><span>⚙️</span><b>إعدادات الصندوق</b></button>
        <button onclick="QatraSecurity.lock()"><span>🔒</span><b>قفل التطبيق</b></button>
      </div></div>
    </section>
  </main>
  <div id="cashierModal" class="cashier-modal" hidden>
    <div class="cashier-modal-backdrop" onclick="Cashier.closeModal()"></div>
    <div class="cashier-modal-sheet" role="dialog" aria-modal="true" aria-labelledby="cashierModalTitle">
      <div class="cashier-modal-head"><h3 id="cashierModalTitle">الصندوق</h3><button class="light mini" onclick="Cashier.closeModal()">إغلاق</button></div>
      <div id="cashierModalBody"></div>
    </div>
  </div>
  <script src="assets/secure_bridge.js"></script>
  <script src="assets/cashier.js"></script>
  <script src="assets/ux-v26.js"></script>
</body>
</html>

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qatra_pro
      POSTGRES_USER: qatra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - qatra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatra -d qatra_pro"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - qatra_internal

  api:
    build:
      context: .
      dockerfile: server/QatraPro.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__QatraDb: Host=postgres;Port=5432;Database=qatra_pro;Username=qatra;Password=${POSTGRES_PASSWORD};Pooling=true;Maximum Pool Size=100
      Jwt__Key: ${QATRA_JWT_KEY}
      Jwt__Issuer: QatraPro
      Jwt__Audience: QatraPro.Clients
      BootstrapAdmin__Username: ${QATRA_ADMIN_USERNAME}
      BootstrapAdmin__Pin: ${QATRA_ADMIN_PIN}
      BootstrapAdmin__WorkspaceId: ${QATRA_WORKSPACE_ID:-rawdah}
      Cors__AllowedOrigins: ${QATRA_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${QATRA_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - qatra_internal

volumes:
  qatra_postgres_data:

networks:
  qatra_internal:
    driver: bridge

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>قطرة برو | الكاشف</title>
  <meta name="theme-color" content="#102A43">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/reader.css">
  <link rel="stylesheet" href="assets/design-v25.css">
  <link rel="stylesheet" href="assets/qatra-brand.css">
  <link rel="stylesheet" href="assets/ux-v26.css">
</head>
<body class="reader-body role-reader">
  <header class="app-header qatra-brand-header no-print">
    <div class="qatra-brand-lockup">
      <img class="qatra-project-mark" src="assets/qatra-pro-mark.svg" alt="Qatra Pro">
      <div class="qatra-brand-copy"><b>QATRA <span>PRO</span></b><small>نظام إدارة خدمات المياه</small><em>الكاشف</em></div>
    </div>
    <div class="header-actions">
      <button class="header-action qatra-header-action" onclick="Reader.openDriveSync()">المزامنة</button>
      <button class="header-action qatra-header-action" onclick="Reader.openSettings()">الإعدادات</button>
    </div>
  </header>
  <nav class="tabs no-print compact-tabs reader-nav">
    <button data-tab="home" class="active">الرئيسية</button>
    <button data-tab="readings">القراءات</button>
    <button data-tab="sync">المزامنة</button>
    <button data-tab="more">المزيد</button>
  </nav>
  <main id="readerRoot">
    <section id="home" class="reader-tab active"></section>
    <section id="readings" class="reader-tab"></section>
    <section id="sync" class="reader-tab"></section>
    <section id="more" class="reader-tab">
      <div class="card qatra-more-card"><h2>المزيد</h2><div class="menu-grid qatra-more-grid">
        <button onclick="QatraSecurity.openLicense()"><span>🔑</span><b>المعلومات والتواصل والترخيص</b></button>
        <button onclick="QatraSecurity.open()"><span>🛡️</span><b>الأمان والدخول</b></button>
        <button onclick="Reader.openDriveSync()"><span>☁️</span><b>مركز المزامنة</b></button>
        <button onclick="QatraDriveBackup.open()"><span>🔄</span><b>نسخ Google Drive</b></button>
        <button onclick="Reader.openSettings()"><span>⚙️</span><b>إعدادات الكاشف</b></button>
        <button onclick="QatraSecurity.lock()"><span>🔒</span><b>قفل التطبيق</b></button>
      </div></div>
    </section>
  </main>
  <div id="readerModal" class="reader-modal" hidden>
    <div class="reader-backdrop" onclick="Reader.closeModal()"></div>
    <div class="reader-sheet"><div class="reader-sheet-head"><h3 id="readerModalTitle">الكاشف</h3><button class="light mini" onclick="Reader.closeModal()">إغلاق</button></div><div id="readerModalBody"></div></div>
  </div>
  <script src="assets/secure_bridge.js"></script>
  <script src="assets/reader.js"></script>
  <script src="assets/ux-v26.js"></script>
</body>
</html>
